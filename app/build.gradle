plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rainbow.statusbarlyric'
    compileSdk 34

    defaultConfig {
        applicationId "com.rainbow.statusbarlyric"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    signingConfigs {
        release {
            storeFile file('release.keystore')
            storePassword 'rainbow123456'
            keyAlias 'rainbow'
            keyPassword 'rainbow123456'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
